[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nuxem"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "jax==0.7.2",
    "flax==0.12.0",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]==0.7.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nuxem*"]
