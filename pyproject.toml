[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tachys"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "jax==0.10.2",
    "flax==0.12.0",
    "numpy",
    "scipy",
    "einops",
    "pytest",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]==0.10.2"]
docs = [
    "sphinx>=7.2",
    "pydata-sphinx-theme>=0.15",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tachys*"]
