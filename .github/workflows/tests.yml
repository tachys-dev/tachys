name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install OpenMPI
        run: sudo apt-get install -y openmpi-bin libopenmpi-dev

      - name: Install dependencies
        run: pip install -e . mpi4py

      - name: Run tests
        run: pytest tests/ -v
